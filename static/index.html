<!DOCTYPE html>
<html>

<head>

    <title>AI PDF Chatbot</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        .box {
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        input[type="file"] {
            margin-bottom: 10px;
        }

        input[type="text"] {
            width: 70%;
            padding: 10px;
        }

        button {
            padding: 10px 15px;
            cursor: pointer;
        }

        #answer {
            margin-top: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 8px;
        }

    </style>

</head>

<body>

    <h1>AI PDF Chatbot</h1>


    <div class="box">

        <h2>1. Upload PDF</h2>

        <input
            type="file"
            id="pdfFile"
            accept=".pdf"
        >

        <button onclick="uploadPDF()">
            Upload
        </button>

        <p id="uploadStatus"></p>

    </div>


    <div class="box">

        <h2>2. Ask a Question</h2>

        <input
            type="text"
            id="question"
            placeholder="Ask something about your PDF..."
        >

        <button onclick="askQuestion()">
            Ask
        </button>

        <div id="answer"></div>

    </div>


<script>

async function uploadPDF() {

    const fileInput =
        document.getElementById("pdfFile");

    const status =
        document.getElementById("uploadStatus");

    if (!fileInput.files.length) {

        status.innerText =
            "Please select a PDF.";

        return;
    }

    const formData =
        new FormData();

    formData.append(
        "file",
        fileInput.files[0]
    );

    status.innerText =
        "Uploading and processing...";

    const response =
        await fetch(
            "/upload",
            {
                method: "POST",
                body: formData
            }
        );

    const data =
        await response.json();

    if (response.ok) {

        status.innerText =
            data.message;

    } else {

        status.innerText =
            "Error: " + data.detail;

    }
}


async function askQuestion() {

    const question =
        document.getElementById("question").value;

    const answer =
        document.getElementById("answer");

    if (!question.trim()) {

        answer.innerText =
            "Please enter a question.";

        return;
    }

    answer.innerText =
        "Thinking...";

    const response =
        await fetch(
            "/ask",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    question: question
                })
            }
        );

    const data =
        await response.json();

    if (response.ok) {

        answer.innerHTML =
            "<strong>Answer:</strong><br><br>" +
            data.answer +
            "<br><br>" +
            "<strong>Sources:</strong> " +
            (data.sources && data.sources.length
                ? data.sources
                    .map(source => "Page " + source)
                    .join(", ")
                : "No sources found");

    } else {

        answer.innerText =
            "Error: " + data.detail;

    }
}

</script>

</body>

</html>
